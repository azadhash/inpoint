[project]
name = "asst"
version = "0.1.0"
description = "Jira asset harvester + video transcription and frame extraction toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mlx-whisper>=0.4.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "openai-whisper>=20240930 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pillow>=10.4",
    "httpx>=0.27",
]

[project.scripts]
asst = "asst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asst"]
